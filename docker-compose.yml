services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@host.docker.internal:5432/contract_builder
    volumes:
      - ./backend/app/templates:/app/app/templates

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - backend